name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/cityone

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to cityone-app VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            IMAGE="ghcr.io/${{ github.repository }}/cityone:${{ github.sha }}"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"

            docker stop cityone 2>/dev/null || true
            docker rm cityone 2>/dev/null || true

            docker run -d --restart unless-stopped \
              --name cityone \
              -p 8080:8080 \
              -e NODE_ENV=production \
              -e GOOGLE_BACKEND_MAPS_KEY="${{ secrets.GOOGLE_BACKEND_MAPS_KEY }}" \
              -e GOOGLE_FRONTEND_MAPS_KEY="${{ secrets.GOOGLE_FRONTEND_MAPS_KEY }}" \
              -e RAILRADAR_API_KEY="${{ secrets.RAILRADAR_API_KEY }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e ONDC_SUBSCRIBER_ID="${{ vars.ONDC_SUBSCRIBER_ID }}" \
              -e ONDC_SUBSCRIBER_URL="${{ vars.ONDC_SUBSCRIBER_URL }}" \
              -e ONDC_UNIQUE_KEY_ID="${{ vars.ONDC_UNIQUE_KEY_ID }}" \
              -e ONDC_SIGNING_PRIVATE_KEY="${{ secrets.ONDC_SIGNING_PRIVATE_KEY }}" \
              -e ONDC_SIGNING_PUBLIC_KEY="${{ vars.ONDC_SIGNING_PUBLIC_KEY }}" \
              -e ONDC_ENCRYPTION_PRIVATE_KEY="${{ secrets.ONDC_ENCRYPTION_PRIVATE_KEY }}" \
              -e ONDC_ENCRYPTION_PUBLIC_KEY="${{ vars.ONDC_ENCRYPTION_PUBLIC_KEY }}" \
              -e ONDC_SITE_VERIFICATION_SIGNED="${{ vars.ONDC_SITE_VERIFICATION_SIGNED }}" \
              -e ONDC_REGISTRY_URL="${{ vars.ONDC_REGISTRY_URL }}" \
              -e ONDC_GATEWAY_URL="${{ vars.ONDC_GATEWAY_URL }}" \
              -e ONDC_ENV="${{ vars.ONDC_ENV }}" \
              -e ONDC_MOCK_PAYMENT="${{ vars.ONDC_MOCK_PAYMENT }}" \
              -e ONDC_SKIP_AUTH_VERIFICATION="${{ vars.ONDC_SKIP_AUTH_VERIFICATION }}" \
              -e ONDC_BUYER_FINDER_FEES_PCT="${{ vars.ONDC_BUYER_FINDER_FEES_PCT }}" \
              -e ONDC_COURT_JURISDICTION="${{ vars.ONDC_COURT_JURISDICTION }}" \
              "$IMAGE"

            echo "Deployed $IMAGE"
